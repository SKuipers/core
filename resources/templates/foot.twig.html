Page Foot: Outputs at the bottom, right before the closing </body> tag.
Useful for scripts that need to execute after the page has loaded.
-->#}

{% for code in page.extraFoot %}
    {{ code|raw }}
{% endfor %}

{% for asset in page.scriptsFoot %}
    {% set assetVersion = asset.version is not empty ? asset.version : version %}
    {% if asset.type == 'inline' %}
        <script type="text/javascript">{{ asset.src|raw }}</script>
    {% else %}
        <script type="text/javascript" src="{{ absoluteURL }}/{{ asset.src }}?v={{ assetVersion }}.{{ cacheString }}"></script>
    {% endif %}
{% endfor %}

<div id="modal" x-cloak x-show="modalOpen" x-trap.inert.noreturn="modalOpen" @keydown.escape.window="modalOpen = false" class="fixed inset-0 z-90 overflow-y-auto" style="display:none;" aria-labelledby="modal-title" role="dialog" aria-modal="true" >

    <div class="flex items-center content-center justify-center min-h-screen px-4 text-center sm:block sm:p-0 overflow-hidden">

        <div x-cloak @click="modalOpen = false" x-show="modalOpen" 
            x-transition:enter="transition ease-out duration-150 transform"
            x-transition:enter-start="opacity-0" 
            x-transition:enter-end="opacity-100"
            x-transition:leave="transition ease-in duration-200 transform"
            x-transition:leave-start="opacity-100" 
            x-transition:leave-end="opacity-0"
            class="fixed inset-0 transition bg-black/40  " 
            aria-hidden="true"
        ></div>

        <div x-cloak x-show="modalOpen" 
            x-transition:enter="transition ease-out duration-150 transform"
            x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95" 
            x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
            x-transition:leave="transition ease-in duration-200 transform"
            x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100" 
            x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
            class="relative inline-block w-full overflow-y-auto p-2 my-20 overflow-x-hidden text-left transition-all transform rounded-2xl border border-gray-200 backdrop-blur-lg backdrop-contrast-125 shadow-xl bg-white/80 dark:bg-gray-800/90 "
            :class="modalType == 'delete' || modalType == 'medium' ? 'max-w-2xl' : modalType == 'small' ? 'max-w-2xl sm:max-w-md' : 'max-w-6xl'"
            style="min-height: 12vh; max-height: 80vh"
        >
            <!-- <div x-show="!modalAlert" class="flex w-full -mt-4 ml-4 justify-end">
                <button @click="modalOpen = false" class="bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-400 focus:outline-none hover:text-gray-700 dark:hover:text-gray-300">
                    {{ icon('basic', 'x-mark', 'size-6') }}
                </button>
            </div> -->

            <div id="modalContent" x-ref="modalContent" class="p-6 rounded-xl border border-gray-400/60 bg-white dark:border-none dark:bg-gray-800">

                <template x-if="modalAlert != false">
                    <div id="modalAlertContent">
                        <div x-text="modalAlert.title" class="text-base font-semibold mb-4"></div>
    
                        <div x-text="modalAlert.text" class="text-sm font-normal text-gray-600 mb-4"></div>
    
                        
                    </div>
                </template>
            </div>

            <template x-if="modalAlert != false">
                <div class="flex justify-end items-center gap-2 pt-2">
    
                    <button @click="modalOpen = false" type="button" class="rounded-lg text-sm sm:leading-5 hover:bg-gray-400/10 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-200 inline-flex align-middle items-center px-4 py-2 font-semibold focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:focus-visible:outline-blue-400">
                        <span x-text="modalAlert.cancel ?? '{{ __('OK') }}'"></span>
                    </button>

                    <button x-cloak x-show="modalAlert.confirm" type="button" name="Submit" value="Submit" class="rounded-lg text-sm sm:leading-5  border-gray-800 bg-gray-800 hover:bg-gray-900 text-white inline-flex align-middle items-center border border-gray-400 px-4 py-2 font-semibold shadow-sm focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500">
                        <span x-text="modalAlert.confirm">{{ __('Submit') }}</span>
                    </button>
                </div>

            </template>

            
        </div>
    </div>
</div>

<nav id="drawer" x-cloak x-show="drawerOpen" x-trap.inert.noreturn="drawerOpen"  @keydown.escape.window="drawerOpen = false">
    <div id="drawer" aria-labelledby="drawer-title" class="fixed inset-0 size-auto max-h-none max-w-none overflow-hidden bg-transparent backdrop:bg-transparent z-[100]">
      <div tabindex="0" class="absolute inset-0 pl-10 focus:outline-none sm:pl-16">
        <div class="ml-auto block size-full max-w-xl transform transition " 
            x-show="drawerOpen"
            x-transition:enter="transition ease-out duration-500"
            x-transition:enter-start="translate-x-full"
            x-transition:enter-end="translate-x-0"
            x-transition:leave="transition ease-in-out duration-300"
            x-transition:leave-start="translate-x-0"
            x-transition:leave-end="translate-x-full"
            @click.outside="drawerOpen = false"
        >

          <div class="relative flex h-full flex-col px-2 py-2 rounded-l-2xl border border-gray-200 backdrop-blur-lg backdrop-contrast-125 shadow-xl bg-white/80 dark:bg-gray-800/90 dark:after:absolute dark:after:inset-y-0 dark:after:left-0 dark:after:w-px dark:after:bg-white/10">
            <div class="px-2 sm:px-3 py-2 flex items-start justify-between">
              
            <h2 id="drawer-title" class="text-base font-semibold text-gray-900/80 dark:text-white/80">Panel title</h2>
            <div class="ml-3 flex items-center">
                <button @click="drawerOpen = false" type="button" command="close" commandfor="drawer" class="relative rounded-md text-gray-400 hover:text-gray-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:hover:text-white dark:focus-visible:outline-indigo-500">
                <span class="absolute -inset-2.5"></span>
                <span class="sr-only">Close panel</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" data-slot="icon" aria-hidden="true" class="size-6">
                    <path d="M6 18 18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                </button>
            </div>
              
            </div>
            <div class="relative mt-2 flex-1 p-2 sm:p-4 rounded-xl overflow-y-auto overflow-x-hidden border border-gray-400/60 bg-white dark:border-none dark:bg-gray-800" style="scrollbar-width: thin;">

                <div id="drawerContent" x-ref="drawerContent">
                </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </nav>
