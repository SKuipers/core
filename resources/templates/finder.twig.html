<div id="fastFinder" x-cloak x-show="finderOpen" x-trap.inert.noreturn="finderOpen" 
    @keydown.meta.k.window.prevent="finderOpen = true; finderSearch = ''; $focus.focus($refs.fastFinderSearch)" 
    @keydown.escape.window="finderOpen = false"  @keydown.enter.prevent="$focus.focused() == $refs.fastFinderSearch ? $refs.searching.querySelector('a').click() : $focus.focused().click()"
    @keydown.down.prevent.window="$focus.focus($refs.searching.firstChild)"
    @click.self="finderOpen = false" 
    class="fixed inset-0 z-90 flex items-start justify-center py-16 overflow-y-auto bg-black/20 text-gray-800 dark:text-gray-400" role="dialog" aria-modal="true" >
        <div x-cloak x-show="finderOpen"  
            x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0 scale-95" 
            x-transition:enter-end="opacity-100 scale-100"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100 scale-100" 
            x-transition:leave-end="opacity-0 scale-95"
            class="relative w-full max-w-2xl rounded-xl border-b border-gray-200/80 bg-white shadow-[0_1px_16px_-2px_rgba(63,63,71,0.2)] dark:border-gray-950 dark:bg-gray-800 dark:shadow-[0_10px_15px_rgba(0,0,0,.5)] dark:inset-shadow-2xs dark:inset-shadow-white/10" tabindex="-1">

            <header class="group/cmd-input flex h-16 items-center gap-2 border-b border-gray-200/80 px-3 py-1 dark:border-gray-950">
                
                <div @click="finderSearch=''" class="absolute top-0 left-0 mt-5.5 ml-6 text-gray-600" tabindex="-1">
                    {{ icon('basic', 'search', 'size-5 opacity-50') }}
                </div>

                <input class="form-control flex-1 rounded-lg placeholder:text-gray-400 placeholder:text-opacity-60 text-base pl-10 h-10 " 
                    type="search" autocomplete="off" 
                    name="search" placeholder="{{ __('Search') }}" 
                    hx-post="index_fastFinder_ajax.php" 
                    hx-trigger="input changed delay:500ms, search" 
                    hx-target="#search-results" 
                    hx-include="[name='searchType']"
                    hx-indicator=".htmx-indicator"
                    x-model="finderSearch"
                    x-ref="fastFinderSearch"
                    tabindex="0"
                >

                {% if roleCategory == 'Staff' %}
                <select name="searchType" class="w-20 h-10 px-3 text-sm font-medium bg-gray-100 rounded-xl"
                    hx-post="index_fastFinder_ajax.php" 
                    hx-target="#search-results" 
                    hx-include="[name='search']"
                    hx-indicator=".htmx-indicator"
                    tabindex="-1"
                    >
                    <option value="all">{{ __('All') }}</option>
                    <option value="students">{{ __('Student') }}</option>
                    <option value="staff">{{ __('Staff') }}</option>
                    <option value="classes">{{ __('Class') }}</option>
                    <option value="departments">{{ __('Department') }}</option>
                    <option value="facilities">{{ __('Facility') }}</option>
                    <option value="actions">{{ __('Action') }}</option>
                </select>
                {% else %}
                <input name="searchType" type="hidden" value="all">
                {% endif %}
                
            </header>

            <div class="px-3 py-3 max-h-96 overflow-y-auto overflow-x-hidden" tabindex="-1">

                <div id="search-wrap" class="w-full origin-top-right rounded-lg focus:outline-none" role="menu" aria-orientation="vertical" aria-labelledby="menu-button" tabindex="-1">
                    <div class="hidden htmx-indicator h-10 w-full px-3 py-2 text-sm italic text-gray-700 pointer-events-none"> 
                        {{ __('Searching...') }} 
                    </div>

                    <div id="search-results" x-ref="searching"
                        @keydown.down.prevent.window.stop="$focus.next()"
                        @keydown.up.prevent.window.stop="$focus.previous()">
                        <button class="block px-3 py-2 text-sm text-gray-700 rounded-lg" tabindex="-1" >
                            {{ __('Start typing a name ...') }}
                        </button>
                    </div>
                </div>
