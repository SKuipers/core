<ul class="hidden md:flex items-center justify-start gap-1 list-none mb-px">
    <li class="mx-0 px-0">
        <a hx-boost="true" hx-target="#content-wrap" hx-select="#content-wrap" hx-swap="outerHTML show:no-scroll swap:0s" hx-indicator="#loadingIndicator" class="block text-sm text-white/85 font-medium text-gray-100 hover:text-gray-800 no-underline ml-1 px-4 py-3 dark:text-gray-300 dark:hover:text-gray-100" href="{{ absoluteURL }}/index.php">{{ __('Home') }}</a>
    </li>

    {% if isLoggedIn %}
        {% for categoryName, items in menuMain %}
        <li class="sm:relative group mx-0 px-0 " x-data="{menuOpen: false}" @mouseleave="menuOpen = false" @click.outside="menuOpen = false">
            <a @mouseenter="menuOpen = true" @click="menuOpen = true" :class="{'text-gray-800': menuOpen, 'text-gray-100': !menuOpen}" class="block text-sm text-white/85 font-medium text-gray-100 hover:text-gray-800 no-underline px-4 py-3 cursor-pointer dark:text-gray-300 dark:hover:text-gray-100">{{ __(categoryName) }}</a>

            <ul x-cloak x-show="menuOpen" x-transition:enter.duration.250ms x-transition:leave.duration.0s class="list-none bg-black bg-opacity-75 backdrop-blur-lg backdrop-contrast-125 backdrop-saturate-150 rounded-md absolute w-available -mt-1 ms-4 me-4 sm:mx-0 sm:w-52 my-0 p-1 sm:p-1.5 z-50 {{ rightToLeft ? 'right-0' : 'left-0' }} dark:bg-opacity-60">
                {% for item in items %}
                <li class="hover:bg-{{ themeColour }}-700 rounded">
                    <a @click="menuOpen = false" class="block text-sm text-white focus:text-{{ themeColour }}-200 no-underline px-2 py-2 md:py-1 leading-normal {{ rightToLeft ? 'text-right' : 'text-left' }} dark:text-gray-200 dark:focus:text-gray-400" href="{{ item.url }}">
                        {{ __(item.name, item.textDomain) }}
                    </a>
                </li>
                {% endfor %}
            </ul>
            <div x-cloak x-show="menuOpen" class="absolute -left-8 h-48 m-0 z-40" style="width:calc(100% + 8rem);"></div>
        </li>
        {% endfor %}
    {% endif %}

    <li class=" notificationTray flex-grow relative">
        <div class="flex flex-row-reverse items-center">

            <div id="finderTray" class="mr-4 w-auto sm:w-full max-w-sm">
                <!-- {{ include('finder.twig.html') }} -->
            </div>

            <!-- {{ include('tray.twig.html') }} -->
        </div>
    </li>
</ul>
